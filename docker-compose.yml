services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: psb-legal-backend
    restart: unless-stopped
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      GEN_MODEL: ${GEN_MODEL:-}
    volumes:
      # Локальные эмбеддинги читаются с хоста, а не копируются в образ.
      - ./models:/app/models:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: psb-legal-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
